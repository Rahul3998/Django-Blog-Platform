{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <h3>Register</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success" type="submit">Register</button>
        <a href="{% url 'login' %}" class="btn btn-link">Back to Login</a>
    </form>
</div>
{% endblock %}
