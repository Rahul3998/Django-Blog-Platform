<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Blog Platform{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-center flex-grow-1">My Blog</h1>
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="me-2">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-sm">Register</a>
                {% endif %}
                <button class="btn btn-outline-secondary btn-sm" id="toggleTheme">🌗</button>
            </div>
        </div>

        {% block content %}
        <!-- Page content will appear here -->
        {% endblock %}
        
    </div>

    <script>
        const toggleBtn = document.getElementById("toggleTheme");
        const htmlTag = document.documentElement;

        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) htmlTag.setAttribute("data-bs-theme", savedTheme);

        toggleBtn.addEventListener("click", () => {
            let current = htmlTag.getAttribute("data-bs-theme");
            let next = current === "dark" ? "light" : "dark";
            htmlTag.setAttribute("data-bs-theme", next);
            localStorage.setItem("theme", next);
        });
    </script>
</body>
</html>
